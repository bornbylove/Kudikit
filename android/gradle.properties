org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Longer network timeouts to tolerate a slow/flaky connection
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
android.useAndroidX=true
android.enableJetifier=true

# AAPT2 timeout fix
android.aapt2DaemonTimeoutSeconds=300

# Disable daemon caching to prevent stale daemon issues
android.enableAapt2DaemonModeCache=false

# Parallel builds & caching for performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
