
name: kudipay
description: "KudiPay — Nigerian fintech mobile application."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons:
  flutter_svg:
  google_fonts:
  smooth_page_indicator:

  # State Management
  flutter_riverpod:
  riverpod_annotation:

  # Forms & Validation
  pinput:

  # UI Components
  card_swiper:
  flutter_clean_calendar:

  # Network & API
  dio:
  # http kept for add_money_services which uses it directly
  http:
  uuid: 

  # Connectivity
  connectivity_plus:
  internet_connection_checker_plus:

  # Data & Storage
  shared_preferences:
  flutter_secure_storage:

  # Firebase (initialise in main() before going live)
  firebase_auth:
  firebase_core:
  cloud_firestore:
  firebase_messaging: 
  flutter_local_notifications: 

  # Media & Files
  camera: 0.12.0+2
  image_picker:
  # Downscales KYC images before base64 encoding. CameraController produces
  # full-resolution files with no quality option, and base64 inflates them a
  # further ~33% — without this, selfies exceed the payload limit.
  flutter_image_compress: ^2.3.0
  file_picker:
  csv: ^8.0.0
  permission_handler:
  flutter_contacts: ^1.1.7  # or latest

  # Utilities
  intl:
  crypto:
  shimmer: 

  # Location
  geolocator: 
  geocoding: 
 
  # Maps
  google_maps_flutter: 
 
  # Phone calls
  url_launcher: 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  build_runner: 
  riverpod_generator: 

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Kudikit_teal_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/kudikit_play_store_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    # FIXED: All PolySans weight variants registered.
    # Previously only neutral.otf was registered — bold/semibold text
    # was silently falling back to the single face.
    - family: PolySans
      fonts:
        - asset: assets/fonts/polysanstrial-slim.otf
          weight: 300
        - asset: assets/fonts/polysanstrial-neutral.otf
          weight: 400
        - asset: assets/fonts/polysanstrial-median.otf
          weight: 500
        - asset: assets/fonts/polysanstrial-median.otf
          weight: 600
        - asset: assets/fonts/polysanstrial-bulky.otf
          weight: 700
        - asset: assets/fonts/polysanstrial-bulky.otf
          weight: 800
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800